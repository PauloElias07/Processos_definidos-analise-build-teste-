name: Dependa

on:
  push:
    banch: [main]

jobs:
  analise:
    name: Análise
    runs-on: ubuntu-latest

    steps:
      - name: Preparar ambiente
      - uses: actions/checkout@v4
      
      - name: Configurar Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      - name: Analise Estatica(Linter) Flake8
        run: flake8 .
        
      - name: Análise de segurança com Bandit
        run: bandit -r .

    build:
      name: Build
      runs-on: ubuntu-latest
      needs: analise

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Gerar arquivo ZIP
          run: |
            zip -r projeto.zip . \
              -x ".git/*" \
              -x ".github/*" \
              -x "__pycache__/*"

        - name: Upload do ZIP
          uses: actions/upload-artifact@v4
          with:
            name: projeto-python
            path: projeto.zip

    testes:
      name: Testes
      runs-on: ubuntu-latest
      needs: build

    steps:
      - name: Baixar ZIP do build
        uses: actions/download-artifact@v4
        with:
          name: projeto-python

      - name: Extrair ZIP
        run: unzip projeto.zip -d projeto

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: projeto
        run: pip install -r requirements.txt

      - name: Executar testes
        working-directory: projeto
        run: pytest -v